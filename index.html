<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nusa AI</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f9;--panel:#fff;--ink:#14212e;--mute:#5d6d7e;--line:#d8e0e8;--acc:#2f4fd8;--accink:#fff;--user:#e3e9fb}
@media(prefers-color-scheme:dark){:root{--bg:#0d1824;--panel:#13222f;--ink:#e6eef5;--mute:#8da0b2;--line:#233545;--acc:#7d97ff;--accink:#0d1824;--user:#1d3050}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px 0 10px}
h1{font:700 1.5rem "Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
select,button,textarea{font:inherit;color:var(--ink)}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;cursor:pointer}
button.main{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.rail{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.rail i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#status{font-size:.85rem;color:var(--mute);margin:6px 0 12px;min-height:1.4em}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:6px 2px 14px}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}
.msg.user{align-self:flex-end;background:var(--user);padding:9px 14px;border-radius:14px 14px 4px 14px;max-width:85%}
.msg.ai{align-self:flex-start;padding:2px 0;border-left:3px solid var(--acc);padding-left:12px}
.hint{margin:auto;max-width:34em;color:var(--mute);text-align:center}
.hint b{color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.3rem;display:block;margin-bottom:6px}
form{display:flex;gap:8px;align-items:flex-end;padding:10px 0 14px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:160px}
@media(prefers-reduced-motion:reduce){.rail i{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Nusa AI</h1>
  <div class="ctl">
    <select id="model" aria-label="Pilih model">
      <option value="onnx-community/SmolLM2-360M-Instruct">SmolLM2 360M (paling ringan)</option>
      <option value="onnx-community/Qwen2.5-0.5B-Instruct" selected>Qwen2.5 0.5B (seimbang)</option>
      <option value="onnx-community/Qwen2.5-1.5B-Instruct">Qwen2.5 1.5B (butuh WebGPU)</option>
    </select>
    <button id="load" class="main">Muat model</button>
    <button id="clear" type="button">Chat baru</button>
  </div>
</header>
<div class="rail"><i id="bar"></i></div>
<div id="status">Model belum dimuat.</div>

<main id="log" aria-live="polite">
  <div class="hint" id="hint"><b>AI yang berjalan di browsermu</b>Pilih model, klik “Muat model”, lalu mulai bertanya. Unduhan pertama sekitar 300 MB sampai 1 GB, setelah itu tersimpan di cache browser dan semua jawaban dibuat di perangkatmu sendiri.</div>
</main>

<form id="form">
  <textarea id="input" rows="1" placeholder="Tulis pertanyaanmu…" aria-label="Pesan" disabled></textarea>
  <button id="send" class="main" disabled>Kirim</button>
  <button id="stop" type="button" hidden>Berhenti</button>
</form>

<script type="module">
import { pipeline, TextStreamer, InterruptableStoppingCriteria }
  from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1";

// Ubah kepribadian AI-mu di sini.
const SYSTEM = "Kamu adalah Nusa AI, asisten yang ramah dan jujur. Jawab dalam bahasa yang dipakai pengguna (utamakan Bahasa Indonesia), singkat dan jelas. Jika tidak tahu, katakan tidak tahu.";

const $ = s => document.querySelector(s);
const log = $("#log"), form = $("#form"), input = $("#input"), send = $("#send"),
      stop = $("#stop"), load = $("#load"), sel = $("#model"), status = $("#status"), bar = $("#bar");
let gen = null, busy = false, history = [];
const stopper = new InterruptableStoppingCriteria();

function add(role, text) {
  $("#hint")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

load.onclick = async () => {
  load.disabled = sel.disabled = true;
  const gpu = !!navigator.gpu, files = {};
  try {
    gen = await pipeline("text-generation", sel.value, {
      device: gpu ? "webgpu" : "wasm",
      dtype: gpu ? "q4" : "q8",
      progress_callback: p => {
        if (p.status === "progress" && p.total) {
          files[p.file] = { l: p.loaded, t: p.total };
          let l = 0, t = 0;
          for (const f of Object.values(files)) { l += f.l; t += f.t; }
          const pct = Math.round(l / t * 100);
          bar.style.width = pct + "%";
          status.textContent = `Mengunduh model… ${pct}% (${Math.round(l / 1e6)} dari ${Math.round(t / 1e6)} MB)`;
        }
      }
    });
    bar.style.width = "100%";
    status.textContent = `Model siap (${gpu ? "WebGPU" : "CPU/WASM, lebih lambat"}).`;
    input.disabled = send.disabled = false;
    input.focus();
  } catch (err) {
    status.textContent = "Gagal memuat model: " + err.message + ". Coba model yang lebih kecil atau browser Chrome/Edge terbaru.";
    load.disabled = sel.disabled = false;
  }
};

form.onsubmit = async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || !gen || busy) return;
  input.value = ""; input.style.height = "auto";
  busy = true; send.hidden = true; stop.hidden = false;
  history.push({ role: "user", content: text });
  add("user", text);
  const out = add("ai", "…");
  let reply = "";
  try {
    const streamer = new TextStreamer(gen.tokenizer, {
      skip_prompt: true, skip_special_tokens: true,
      callback_function: t => { reply += t; out.textContent = reply; log.scrollTop = log.scrollHeight; }
    });
    await gen([{ role: "system", content: SYSTEM }, ...history.slice(-8)], {
      max_new_tokens: 512, do_sample: true, temperature: 0.7, top_p: 0.9,
      repetition_penalty: 1.1, streamer, stopping_criteria: stopper
    });
  } catch (err) {
    out.textContent = "Terjadi kesalahan: " + err.message;
    reply = "";
  }
  stopper.reset();
  if (reply) history.push({ role: "assistant", content: reply }); else history.pop();
  busy = false; send.hidden = false; stop.hidden = true; input.focus();
};

stop.onclick = () => stopper.interrupt();
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});
$("#clear").onclick = () => { if (!busy) { history = []; log.innerHTML = ""; } };
</script>
</body>
</html>
